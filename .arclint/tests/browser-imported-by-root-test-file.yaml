# A colocated unit test is not scanned (scan.exclude), so its import of a
# browser adapter is not judged; production imports stay protected.
rule: browser-imported-by-root
files:
  package.json: '{"dependencies": {"react": "19.2.0", "react-dom": "19.2.0", "yaml": "2.8.1", "@codemirror/state": "6.5.2", "@codemirror/view": "6.38.6", "@lezer/common": "1.2.3", "@replit/codemirror-vim": "6.3.0"}, "devDependencies": {"vitest": "3.2.4", "@playwright/test": "1.56.1", "@testing-library/react": "16.3.0"}}'
  src/contexts/authoring/application/workspace-reducer.ts: 'export const value = 1;

    '
  src/contexts/authoring/browser/workspace-store.ts: 'export const value = 1;

    '
  src/contexts/authoring/application/workspace-reducer.test.ts: 'import { value as v0 } from ''./workspace-reducer'';

    import { value as v1 } from ''../browser/workspace-store'';

    export const value = v0 + v1;

    '
expect: []
